syntax = "proto3";

package conf;

option go_package = "github.com/tx7do/kratos-bootstrap/api/gen/go/conf/v1;conf";

import "google/protobuf/duration.proto";

// 日志
message Logger {
  // 日志类型
  enum Type {
    UNKNOWN = 0;

    ZAP = 1;
    LOGRUS = 2;
    FLUENT = 3;
    ALIYUN = 4;
    TENCENT = 5;
    ZEROLOG = 6;
  }

  // Zap
  message Zap {
    string filename = 1; //
    string level = 2; //
    int32 max_size = 3; //
    int32 max_age = 4; //
    int32 max_backups = 5; //

    string writer = 6; // 输出目标: file、stdout,默认file
    string encoder = 7; // 编码器: json、console,默认json
    optional bool compress = 8; // 是否压缩滚动的历史日志
  }

  // logrus
  message Logrus {
    string level = 1; // 日志等级
    string formatter = 2; // 输出格式：text, json.
    string timestamp_format = 3; // 定义时间戳格式，例如："2006-01-02 15:04:05"
    bool disable_colors = 4; // 不需要彩色日志
    bool disable_timestamp = 5; // 不需要时间戳
  }

  // Fluent
  message Fluent {
    string endpoint = 1; // 公网接入地址

    optional google.protobuf.Duration write_timeout = 10; // 写超时时间
    optional int32 buffer_limit = 11; // 缓冲池大小
    optional google.protobuf.Duration retry_wait = 12; // 重试基础等待时间
    optional int32 max_retry = 13; // 最大重试次数
    optional google.protobuf.Duration max_retry_wait = 14; // 重试最大等待时间
    optional string tag_prefix = 15; // Tag前缀
    optional bool async = 16; // 异步发送(日志洪峰时避免阻塞业务)
    optional bool force_stop_async_send = 17; // 退出时强制停止异步发送
  }

  // 阿里云
  message Aliyun {
    string endpoint = 1; // 公网接入地址
    string project = 2; //
    string access_key = 3; // 访问密钥ID
    string access_secret = 4; // 访问密钥

    string logstore = 10; // 日志库Logstore名称,默认: app
    string security_token = 11; // STS安全令牌
  }

  // 腾讯
  message Tencent {
    string endpoint = 1; // 公网接入地址
    string topic_id = 2; //
    string access_key = 3; // 访问密钥ID
    string access_secret = 4; // 访问密钥
  }

  // Zerolog
  message Zerolog {
    string level = 1; // 日志等级

    string time_field_format = 2; // 定义时间戳格式，例如："2006-01-02 15:04:05"
    string timestamp_field_name = 3; // 时间戳字段名称
    string level_field_name= 4; // 日志等级字段名称
    string message_field_name = 5; // 日志消息字段名称

    string writer = 6; // 输出目标，默认stdout，可选：stdout, stderr, file
    string filename = 7; // 当writer为file时，指定日志文件名

    optional int32 max_size = 10; // 滚动日志单文件最大体积(MB)
    optional int32 max_age = 11; // 滚动日志最大保留天数
    optional int32 max_backups = 12; // 滚动日志最大备份数
    optional bool compress = 13; // 是否压缩滚动的历史日志
  }

  string type = 1;

  optional Zap zap = 2;
  optional Logrus logrus = 3;
  optional Fluent fluent = 4;
  optional Aliyun aliyun = 5;
  optional Tencent tencent = 6;
  optional Zerolog zerolog = 7;
}
